# ==========================================================================
# Signara — development stack
# Usage: docker compose -f docker-compose.dev.yml up -d --build
# ==========================================================================
name: signara-dev

x-logging-default: &logging-default
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  # ------------------------------------------------------------- frontend ---
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WEB_URL: ${WEB_URL:-http://localhost:3000}
    container_name: signara-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WEB_URL: ${WEB_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/']
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logging-default

  # ------------------------------------------------------------------ api ---
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-signara}:${POSTGRES_PASSWORD:-signara}@postgres:5432/${POSTGRES_DB:-signara}?schema=public
    command:
      [
        'node_modules/.bin/prisma',
        'migrate',
        'deploy',
        '--schema',
        'packages/database/prisma/schema.prisma',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging-default

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: signara-api
    restart: unless-stopped
    env_file: .env
    environment:
      API_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-signara}:${POSTGRES_PASSWORD:-signara}@postgres:5432/${POSTGRES_DB:-signara}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-signara}@redis:6379
      S3_ENDPOINT: http://minio:9000
      MEILISEARCH_HOST: http://meilisearch:7700
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-https://auth.signara.innotel.us/application/o/signara/jwks/}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-https://auth.signara.innotel.us/application/o/token/}
      OIDC_USERINFO_URL: ${OIDC_USERINFO_URL:-https://auth.signara.innotel.us/application/o/userinfo/}
    ports:
      - '8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8000/ready']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging-default

  # ------------------------------------------------------------ postgres ---
  postgres:
    image: postgres:16-alpine
    container_name: signara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signara}
      POSTGRES_DB: ${POSTGRES_DB:-signara}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-signara}']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging-default

  # --------------------------------------------------------------- redis ---
  redis:
    image: redis:7-alpine
    container_name: signara-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-signara}', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-signara}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging-default

  # --------------------------------------------------------------- minio ---
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: signara-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-signara}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-signara-secret}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *logging-default

  # --------------------------------------------------------- meilisearch ---
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: signara-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-signara-meili}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *logging-default

  # ------------------------------------------------------------ authentik ---
  authentik-server:
    profiles: ["authentik"]
    image: ghcr.io/goauthentik/server:2024.8.1
    container_name: signara-authentik
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-me-authentik}
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@signara.local}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-change-me}
    ports:
      # Authentik web — bound off the default 9000 to avoid clashing with MinIO's
      # API port in the local dev stack. Behind the proxy it lives at
      # auth.signara.innotel.us (see infra/nginx).
      - '9100:9000'
      - '9443:9443'
    volumes:
      - ./cert:/certs:ro
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9000/health/live/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging-default

  authentik-worker:
    profiles: ["authentik"]
    image: ghcr.io/goauthentik/server:2024.8.1
    container_name: signara-authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-me-authentik}
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@signara.local}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-change-me}
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_started
    volumes:
      - ./cert:/certs:ro
    logging: *logging-default

  authentik-db:
    profiles: ["authentik"]
    image: postgres:16-alpine
    container_name: signara-authentik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD:-authentik}
      POSTGRES_DB: authentik
    volumes:
      - authentikdb:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authentik']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging-default

  authentik-redis:
    profiles: ["authentik"]
    image: redis:7-alpine
    container_name: signara-authentik-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - authentikredis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging-default

  # --------------------------------------------------------- prometheus ---
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: signara-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-30d}
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - promdata:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logging-default

  # -------------------------------------------------------------- grafana ---
  grafana:
    image: grafana/grafana:11.2.0
    container_name: signara-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SERVER_ROOT_URL: https://monitoring.signara.innotel.us
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logging-default

  # ----------------------------------------------------------------- loki ---
  loki:
    image: grafana/loki:3.1.0
    container_name: signara-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    ports:
      - '3100:3100'
    volumes:
      - ./infra/monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3100/ready']
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logging-default

  # --------------------------------------------------------------- backup ---
  backup:
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-signara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signara}
      POSTGRES_DB: ${POSTGRES_DB:-signara}
      AUTHENTIK_POSTGRES_HOST: ${AUTHENTIK_POSTGRES_HOST:-}
      AUTHENTIK_POSTGRES_USER: authentik
      AUTHENTIK_POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD:-}
      AUTHENTIK_POSTGRES_DB: authentik
      SOURCE_S3_ENDPOINT: http://minio:9000
      SOURCE_S3_BUCKET: ${S3_BUCKET:-signara-documents}
      SOURCE_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-signara}
      SOURCE_S3_SECRET_KEY: ${S3_SECRET_KEY:-signara-secret}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-signara-backups}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_ONCE: ${BACKUP_ONCE:-false}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_REQUIRE_REMOTE: ${BACKUP_REQUIRE_REMOTE:-false}
    volumes:
      - ./infra/backup:/backup:ro
      - backupcache:/backup-cache
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *logging-default

  backup-metrics:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ['python', '/metrics/backup_metrics.py']
    volumes:
      - backupcache:/backup-cache:ro
      - ./infra/backup/backup_metrics.py:/metrics/backup_metrics.py:ro
    expose:
      - '9101'
    depends_on:
      - backup
    logging: *logging-default

  # ------------------------------------------------------- alertmanager ---
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: signara-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - '9093:9093'
    volumes:
      - ./infra/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager
    logging: *logging-default

volumes:
  pgdata:
  redisdata:
  miniodata:
  meilidata:
  authentikdb:
  authentikredis:
  promdata:
  grafanadata:
  lokidata:
  backupcache:
  alertdata:
