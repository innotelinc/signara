# docker-compose.override.prod.yml — deployment tweaks layered on
# docker-compose.prod.yml:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.override.prod.yml up -d
#
# The api/frontend healthchecks used to be corrected here (`wget localhost`
# resolves to ::1 while both apps bind IPv4). They now live in
# docker-compose.prod.yml, so this file is only about *this host's* topology.
services:
  # Public object-storage endpoint used by browser-facing presigned document
  # URLs (S3_PUBLIC_ENDPOINT, e.g. https://storage.signara.innotel.us). Host
  # port 9002 avoids the host 9000 taken by Cerulean's Authentik.
  minio:
    ports:
      - '0.0.0.0:9002:9000'

  # Observability + backup are opt-in (they are otherwise in the default set
  # and cost ~2 GB on modest hosts). Start with:
  #   docker compose -f docker-compose.prod.yml -f docker-compose.override.prod.yml \
  #     --profile monitoring up -d prometheus grafana loki alertmanager backup backup-metrics
  prometheus:
    profiles: ['monitoring']
  grafana:
    profiles: ['monitoring']
  loki:
    profiles: ['monitoring']
  alertmanager:
    profiles: ['monitoring']
  backup:
    profiles: ['monitoring']
    # The identity plane is not in this stack: Authentik is Cerulean's, and it
    # runs on the host that owns it (192.168.1.71), where Cerulean dumps it
    # (1-primary/cerulean/scripts/authentik-db-backup.sh). Signara used to reach
    # that database by joining Cerulean's docker network, which worked only while
    # Signara ran on the same host; it now runs on 192.168.1.44, and a docker
    # network does not span hosts. Rather than fail every run trying to reach an
    # unreachable database, the identity dump is explicitly out of scope here:
    # the empty password switches it off in backup.sh, and
    # `signara_backup_identity_expected` reports 0 so the identity-coverage alert
    # does not fire for a host that does not hold the identity plane.
    environment:
      AUTHENTIK_POSTGRES_PASSWORD: ""
  backup-metrics:
    profiles: ['monitoring']
