apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: signara
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: signara
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: signara-secrets, key: REDIS_PASSWORD }
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$(REDIS_PASSWORD)\" ping | grep PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi