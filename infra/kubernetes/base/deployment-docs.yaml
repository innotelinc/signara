# Static documentation site (docs.signara.innotel.us) served by nginx.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: signara
  labels:
    app.kubernetes.io/name: docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docs
    spec:
      containers:
        - name: docs
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: docs
              mountPath: /usr/share/nginx/html:ro
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
      volumes:
        - name: docs
          configMap:
            name: docs-content
---
apiVersion: v1
kind: Service
metadata:
  name: docs
  namespace: signara
  labels:
    app.kubernetes.io/name: docs
spec:
  selector: { app.kubernetes.io/name: docs }
  ports:
    - port: 80