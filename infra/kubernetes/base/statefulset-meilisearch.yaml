apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meilisearch
  namespace: signara
  labels:
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/part-of: signara
spec:
  serviceName: meilisearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meilisearch
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.10
          env:
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: signara-secrets, key: MEILISEARCH_API_KEY }
            - name: MEILI_ENV
              value: "production"
            - name: MEILI_NO_ANALYTICS
              value: "true"
          ports:
            - containerPort: 7700
              name: http
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /meili_data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi