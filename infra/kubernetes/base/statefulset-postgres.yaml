apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: signara
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: signara
spec:
  serviceName: postgres
  replicas: 1 # scale out with replication/PG HA tooling for multi-node HA
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "signara"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: signara-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              value: "signara"
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "signara"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "signara"]
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 50Gi