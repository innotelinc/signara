apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: signara
  labels:
    app.kubernetes.io/name: web
spec:
  selector: { app.kubernetes.io/name: web }
  ports:
    - port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: signara
  labels:
    app.kubernetes.io/name: api
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: signara
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector: { app.kubernetes.io/name: postgres }
  clusterIP: None
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: signara
  labels:
    app.kubernetes.io/name: redis
spec:
  selector: { app.kubernetes.io/name: redis }
  clusterIP: None
  ports:
    - port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: signara
  labels:
    app.kubernetes.io/name: minio
spec:
  selector: { app.kubernetes.io/name: minio }
  ports:
    - port: 9000
      name: api
    - port: 9001
      name: console
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: signara
  labels:
    app.kubernetes.io/name: meilisearch
spec:
  selector: { app.kubernetes.io/name: meilisearch }
  ports:
    - port: 7700
---
apiVersion: v1
kind: Service
metadata:
  name: authentik
  namespace: signara
  labels:
    app.kubernetes.io/name: authentik
spec:
  selector: { app.kubernetes.io/name: authentik }
  ports:
    - port: 80
      targetPort: http