# Prometheus configuration for Signara
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: production
    cluster: signara

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'signara-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']
        labels:
          service: signara-api

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'signara-backup'
    metrics_path: /metrics
    static_configs:
      - targets: ['backup-metrics:9101']
        labels:
          service: signara-backup

  # There is deliberately no scrape job for object storage. MinIO was retired
  # as the primary store (docs/Roadmap.md W3) and is profile-gated behind
  # `legacy-storage`, so its target could only ever be down — a permanently
  # firing StorageEndpointDown, which trains people to ignore alerts. The store
  # Signara actually uses is the estate's onyx-objectstore, which exposes no
  # Prometheus text metrics to scrape. Store failures still surface, through the
  # API's 5xx rate (ApiHighErrorRate) and through the backup job, which reads
  # the same store and reports signara_backup_last_status.
