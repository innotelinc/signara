# Prometheus configuration for Signara
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: production
    cluster: signara

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'signara-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']
        labels:
          service: signara-api

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'signara-backup'
    metrics_path: /metrics
    static_configs:
      - targets: ['backup-metrics:9101']
        labels:
          service: signara-backup

  # MinIO exposes Prometheus metrics on the API endpoint
  - job_name: 'signara-minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: minio
