# ==========================================================================
# Signara alert rules
# Categories: API failures, queue failures, certificate expiration, backup
# failures.
#
# There is no object-storage category. MinIO was retired as the primary store
# (docs/Roadmap.md W3) and the store that replaced it exposes no metrics, so a
# storage rule could only have keyed on a target that never comes up — see the
# note in prometheus.yml. Store failures are covered indirectly and honestly:
# a dead store makes the API return 5xx (ApiHighErrorRate) and makes the backup
# job fail (BackupJobFailed), because the backup reads the same store.
# ==========================================================================
groups:
  - name: signara-api
    rules:
      - alert: ApiHighErrorRate
        expr: |
          sum(rate(signara_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(signara_http_requests_total[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'API 5xx error rate above 5%'
          description: 'The Signara API is returning 5xx errors at {{ $value | humanizePercentage }} over the last 5 minutes.'

      - alert: ApiUnavailable
        expr: up{job="signara-api"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'API is down'
          description: 'Prometheus cannot scrape the Signara API ({{ $labels.instance }}).'

      - alert: ApiHighLatency
        expr:
          histogram_quantile(0.95, sum(rate(signara_http_request_duration_seconds_bucket[10m])) by (le))
          > 2
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'API p95 latency above 2s'

      - alert: RateLimitedClients
        expr: sum(rate(signara_http_requests_total{status="429"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'High rate-limiting activity'
          description: 'More than 10 requests/second are being rejected with 429.'

  - name: signara-queues
    rules:
      - alert: QueueFailuresHigh
        expr: sum(bullmq_queue_failed_count) > 10
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'BullMQ failed-job backlog is high'

      - alert: QueueStalled
        expr: bullmq_queue_waiting_count > 1000
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Queue backlog growing'
          description: "The '{{ $labels.queue }}' queue has {{ $value }} waiting jobs. Check workers and Redis."

  - name: signara-certificates
    rules:
      - alert: CertificateExpiringSoon
        expr: |
          signara_certificate_expiry_timestamp_seconds - time() > 0
            and signara_certificate_expiry_timestamp_seconds - time() < 14 * 24 * 60 * 60
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'TLS certificate expires in under 14 days'
          description: "Signing certificate '{{ $labels.certificate }}' expires in under 14 days. Rotate or renew it now."

      - alert: CertificateExpired
        expr: |
          signara_certificate_expiry_timestamp_seconds - time() < 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'TLS certificate has expired'
          description: "Signing certificate '{{ $labels.certificate }}' has expired. Rotate or revoke it now."

  - name: signara-backups
    rules:
      - alert: BackupJobFailed
        expr: signara_backup_last_status == 0
        for: 30m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Latest backup job failed'
          description: 'The most recent backup run ended in failure. Check infra/backup logs.'

      - alert: BackupStale
        expr: (time() - signara_backup_last_success_timestamp) > 36 * 60 * 60
        for: 30m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'No successful backup in 36 hours'
          description: 'Last successful backup was {{ $value | humanizeDuration }} ago. See docs/DisasterRecovery.md.'

      # Backups that only exist on the host they back up pass every other check
      # here: they run, they are fresh, they are complete, and they die with the
      # box. That is how the estate lost a platform's entire history (see
      # 1-primary/sign/ARCHIVE.md §8), so "no off-host copy" gets its own alert
      # rather than a line in a log nobody reads.
      #
      # This keys on mirror_offhost, not on remote_enabled: a mirror on the same
      # host (or one whose host cannot be shown to be elsewhere) sets
      # remote_enabled=1 while providing no durability, and must not silence it.
      - alert: BackupIsLocalOnly
        expr: signara_backup_mirror_offhost == 0
        for: 6h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Backups are not proven to leave this host'
          description: 'No off-host mirror is configured, the mirror resolves to an address listed in BACKUP_LOCAL_ADDRESSES, or BACKUP_LOCAL_ADDRESSES is unset so off-host cannot be shown. These backups do not survive losing this host. See docs/DisasterRecovery.md §2, then run scripts/restore-drill.sh.'

      # A mirror that is enabled but never completed, or completed too long ago,
      # is the quieter version of the same failure.
      - alert: BackupMirrorStale
        expr: |
          signara_backup_remote_enabled == 1
          and
          (time() - signara_backup_remote_last_success_timestamp) > 36 * 60 * 60
        for: 30m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'The off-host mirror has not completed in 36 hours'
          description: 'Last successful mirror was {{ $value | humanizeDuration }} ago. The local dumps may be current while the copy that survives this host is not.'

      # An identity backup that is not being taken is worse than one that fails:
      # it is discovered on the day someone tries to log in to the restored stack.
      - alert: IdentityDatabaseNotBackedUp
        expr: signara_backup_identity_covered == 0
        for: 6h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Backups do not include the identity database'
          description: 'AUTHENTIK_POSTGRES_PASSWORD is unset, so the dumps contain no logins: a restore returns the documents without the accounts that reach them. Point it at the identity database (docs/DisasterRecovery.md §2).'

      - alert: BackupMirrorNeverCompleted
        expr: |
          signara_backup_remote_enabled == 1
          unless on() signara_backup_remote_last_success_timestamp
        for: 1h
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'An off-host mirror is configured but has never completed'
          description: 'BACKUP_S3_ENDPOINT is set, yet no run has ever mirrored a backup successfully. Check the backup logs for the failure, or unset the mirror so the gap is at least honest.'
