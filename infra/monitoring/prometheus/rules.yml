# ==========================================================================
# Signara alert rules
# Five required categories: API failures, queue failures, certificate
# expiration, storage failures, backup failures.
# ==========================================================================
groups:
  - name: signara-api
    rules:
      - alert: ApiHighErrorRate
        expr: |
          sum(rate(signara_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(signara_http_requests_total[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "API 5xx error rate above 5%"
          description: "The Signara API is returning 5xx errors at {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: ApiUnavailable
        expr: up{job="signara-api"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "API is down"
          description: "Prometheus cannot scrape the Signara API ({{ $labels.instance }})."

      - alert: ApiHighLatency
        expr: histogram_quantile(0.95, sum(rate(signara_http_request_duration_seconds_bucket[10m])) by (le))
          > 2
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "API p95 latency above 2s"

      - alert: RateLimitedClients
        expr: sum(rate(signara_http_requests_total{status="429"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High rate-limiting activity"
          description: "More than 10 requests/second are being rejected with 429."

  - name: signara-queues
    rules:
      - alert: QueueFailuresHigh
        expr: |
          sum(rate(bullmq_jobs_failed_total[5m]))
            / clamp_min(sum(rate(bullmq_jobs_completed_total[5m]) + rate(bullmq_jobs_failed_total[5m])), 1)
          > 0.1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "BullMQ job failure rate above 10%"

      - alert: QueueStalled
        expr: bullmq_queue_waiting_count > 1000
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Queue backlog growing"
          description: "The '{{ $labels.queue }}' queue has {{ $value }} waiting jobs. Check workers and Redis."

      - alert: QueueWorkerDown
        expr: up{job=~".*worker.*"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Queue worker is down"

  - name: signara-certificates
    rules:
      - alert: CertificateExpiringSoon
        expr: |
          time() - cert_expiry_timestamp_seconds < 14 * 24 * 60 * 60
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "TLS certificate expires in under 14 days"
          description: "Certificate for '{{ $labels.hostname }}' expires at {{ $labels.expiry }}. Trigger renewal or rotate now."

      - alert: CertificateExpired
        expr: |
          time() - cert_expiry_timestamp_seconds < 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "TLS certificate has expired"
          description: "Certificate for '{{ $labels.hostname }}' expired — HTTPS traffic is failing."

  - name: signara-storage
    rules:
      - alert: StorageEndpointDown
        expr: up{job="signara-minio"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "MinIO / object storage is unreachable"

      - alert: StorageAlmostFull
        expr: |
          (minio_cluster_capacity_usable_total_bytes - minio_cluster_capacity_usable_free_bytes)
            / minio_cluster_capacity_usable_total_bytes
          > 0.85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Object storage above 85% capacity"

  - name: signara-backups
    rules:
      - alert: BackupJobFailed
        expr: signara_backup_last_status == 0
        for: 30m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Latest backup job failed"
          description: "The most recent backup run ended in failure. Check infra/backup logs."

      - alert: BackupStale
        expr: (time() - signara_backup_last_success_timestamp) > 36 * 60 * 60
        for: 30m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "No successful backup in 36 hours"
          description: "Last successful backup was {{ $value | humanizeDuration }} ago. See docs/DisasterRecovery.md."

  - name: signara-database
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 3m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "PostgreSQL is down"

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PostgreSQL connection count above 80"