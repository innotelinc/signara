# ==========================================================================
# Signara alert rules
# Categories: API failures, queue failures, certificate expiration, backup
# failures, public hostname resolution.
#
# There is no object-storage category. MinIO was retired as the primary store
# (docs/Roadmap.md W3) and the store that replaced it exposes no metrics, so a
# storage rule could only have keyed on a target that never comes up — see the
# note in prometheus.yml. Store failures are covered indirectly and honestly:
# a dead store makes the API return 5xx (ApiHighErrorRate) and makes the backup
# job fail (BackupJobFailed), because the backup reads the same store.
# ==========================================================================
groups:
  - name: signara-api
    rules:
      - alert: ApiHighErrorRate
        expr: |
          sum(rate(signara_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(signara_http_requests_total[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'API 5xx error rate above 5%'
          description: 'The Signara API is returning 5xx errors at {{ $value | humanizePercentage }} over the last 5 minutes.'

      - alert: ApiUnavailable
        expr: up{job="signara-api"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'API is down'
          description: 'Prometheus cannot scrape the Signara API ({{ $labels.instance }}).'

      - alert: ApiHighLatency
        expr:
          histogram_quantile(0.95, sum(rate(signara_http_request_duration_seconds_bucket[10m])) by (le))
          > 2
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'API p95 latency above 2s'

      - alert: RateLimitedClients
        expr: sum(rate(signara_http_requests_total{status="429"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'High rate-limiting activity'
          description: 'More than 10 requests/second are being rejected with 429.'

  - name: signara-queues
    rules:
      # `sum(bullmq_queue_failed_count) > 10` latched, and that was the rule's
      # whole failure mode: the gauge counts jobs that are *retained* in the
      # failed set, so a backlog nobody had cleared kept it firing forever, and
      # the failures it was hiding (two real `send-signing-reminder` ones behind
      # 39 settled sweep jobs) could not be seen through it. Reading the same
      # gauge's *increase* reports jobs that actually entered the failed set in
      # the window — the thing worth a person's attention — and resolves on its
      # own once failures stop, with clearing the backlog a runbook step
      # (docs/Deployment.md §Operations) rather than a condition of silence.
      # increase() is the right function despite the series being a gauge: the
      # value only ever grows until someone clears it, which is exactly the
      # shape increase() treats as a count.
      - alert: QueueFailuresHigh
        expr: sum(increase(bullmq_queue_failed_count[6h])) > 10
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'BullMQ failed-job backlog is growing'
          description: '{{ $value | humanize }} jobs entered the failed set in the last 6 hours. Read the failure reasons and clear what is historical — docs/Deployment.md §Operations.'

      - alert: QueueStalled
        expr: bullmq_queue_waiting_count > 1000
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Queue backlog growing'
          description: "The '{{ $labels.queue }}' queue has {{ $value }} waiting jobs. Check workers and Redis."

  - name: signara-certificates
    rules:
      - alert: CertificateExpiringSoon
        expr: |
          signara_certificate_expiry_timestamp_seconds - time() > 0
            and signara_certificate_expiry_timestamp_seconds - time() < 14 * 24 * 60 * 60
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'TLS certificate expires in under 14 days'
          description: "Signing certificate '{{ $labels.certificate }}' expires in under 14 days. Rotate or renew it now."

      - alert: CertificateExpired
        expr: |
          signara_certificate_expiry_timestamp_seconds - time() < 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'TLS certificate has expired'
          description: "Signing certificate '{{ $labels.certificate }}' has expired. Rotate or revoke it now."

  - name: signara-backups
    rules:
      - alert: BackupJobFailed
        expr: signara_backup_last_status == 0
        for: 30m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Latest backup job failed'
          description: 'The most recent backup run ended in failure. Check infra/backup logs.'

      - alert: BackupStale
        expr: (time() - signara_backup_last_success_timestamp) > 36 * 60 * 60
        for: 30m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'No successful backup in 36 hours'
          description: 'Last successful backup was {{ $value | humanizeDuration }} ago. See docs/DisasterRecovery.md.'

      # Backups that only exist on the host they back up pass every other check
      # here: they run, they are fresh, they are complete, and they die with the
      # box. That is how the estate lost a platform's entire history (see
      # 1-primary/sign/ARCHIVE.md §8), so "no off-host copy" gets its own alert
      # rather than a line in a log nobody reads.
      #
      # This keys on mirror_offhost, not on remote_enabled: a mirror on the same
      # host (or one whose host cannot be shown to be elsewhere) sets
      # remote_enabled=1 while providing no durability, and must not silence it.
      - alert: BackupIsLocalOnly
        expr: signara_backup_mirror_offhost == 0
        for: 6h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Backups are not proven to leave this host'
          description: 'No off-host mirror is configured, the mirror resolves to an address listed in BACKUP_LOCAL_ADDRESSES, or BACKUP_LOCAL_ADDRESSES is unset so off-host cannot be shown. These backups do not survive losing this host. See docs/DisasterRecovery.md §2, then run scripts/restore-drill.sh.'

      # A mirror that is enabled but never completed, or completed too long ago,
      # is the quieter version of the same failure.
      #
      # The age is the *left* side of the `and`, and that order is load-bearing:
      # Prometheus takes an alert's `$value` from its left operand, and the
      # description renders `$value`. With `remote_enabled == 1` first there was
      # nothing to render but the flag, so this alert reported "Last successful
      # mirror was 1s ago" for a mirror that had not completed in 19 days — the
      # one sentence it exists to get right, wrong in the direction that reads
      # as healthy. `on()` keeps the match on the flag alone, as in
      # BackupMirrorNeverCompleted below.
      - alert: BackupMirrorStale
        expr: |
          (time() - signara_backup_remote_last_success_timestamp) > 36 * 60 * 60
          and on() signara_backup_remote_enabled == 1
        for: 30m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'The off-host mirror has not completed in 36 hours'
          description: 'Last successful mirror was {{ $value | humanizeDuration }} ago. The local dumps may be current while the copy that survives this host is not.'

      # An identity backup that is not being taken is worse than one that fails:
      # it is discovered on the day someone tries to log in to the restored stack.
      # Gated on `identity_expected`, which is 1 only while a target is configured:
      # a host that does not hold the identity plane (it lives on another host, and
      # a docker network does not span hosts) is not a coverage gap, and the alert
      # must not read as one — the host that owns Authentik dumps it instead.
      - alert: IdentityDatabaseNotBackedUp
        expr: signara_backup_identity_expected == 1 and signara_backup_identity_covered == 0
        for: 6h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Backups do not include the identity database'
          description: 'AUTHENTIK_POSTGRES_PASSWORD is set (identity is in scope here) yet no identity dump is being taken, so a restore returns the documents without the accounts that reach them. Check the backup logs (docs/DisasterRecovery.md §2).'

      - alert: BackupMirrorNeverCompleted
        expr: |
          signara_backup_remote_enabled == 1
          unless on() signara_backup_remote_last_success_timestamp
        for: 1h
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'An off-host mirror is configured but has never completed'
          description: 'BACKUP_S3_ENDPOINT is set, yet no run has ever mirrored a backup successfully. Check the backup logs for the failure, or unset the mirror so the gap is at least honest.'

  - name: signara-dns
    rules:
      # Nothing else in this file can see this failure. The API answers on its host,
      # the edge serves a valid certificate, Prometheus scrapes both happily — and
      # no browser can connect, because the public name points at nothing. That is
      # what happened on 2026-10-15: the host A records were removed from the zone,
      # the zone, edge and certificate all stayed healthy, and the outage was
      # discovered by a person getting "this site can't be reached".
      #
      # The probe (infra/monitoring/dns_probe.py) resolves each name on every
      # scrape, so a record that disappears surfaces here within a scrape interval
      # instead of in a support ticket.
      #
      # The host-labelled side is the *left* operand, deliberately: Prometheus takes
      # an alert's `$value` and `$labels` from the left operand, and the annotation
      # below renders `{{ $labels.host }}`. With the configured-flag first there
      # would be no host to name and this alert would read as a vague site-wide
      # failure — the one detail it exists to supply. `on()` matches on the flag
      # alone, as in the backup group.
      #
      # Gated on `configured`, in the same spirit as `identity_expected`: a stack
      # that does not set DNS_PROBE_HOSTS is not a coverage gap and must not read as
      # one, rather than firing forever on a probe that was never asked to watch
      # anything.
      - alert: SignaraHostnameNotResolving
        expr: signara_dns_host_matches == 0 and on() signara_dns_probe_configured == 1
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Signara hostname {{ $labels.host }} no longer resolves'
          description: '{{ $labels.host }} no longer resolves to {{ $labels.expected }}, so the service is unreachable for every user even though the API, the edge and the certificate are healthy. Check the zone the name lives in (docs/Deployment.md §2, "When a Signara hostname stops resolving") — a record that vanished is the usual cause, and provisioning will not recreate it while it believes the record is unchanged.'

      # A probe that stopped reporting looks exactly like a probe that has nothing
      # to report, and the difference is whether anyone would be told.
      #
      # `critical`, not `warning`, and that is the whole point: this estate routes
      # `severity = warning` to the silent receiver (docs/Deployment.md §Monitoring),
      # so a warning here would be visible in the UI and mailed to nobody. A dead
      # probe means the alert above can never fire, which is a blind spot on the
      # public names — the same reasoning that makes ApiUnavailable critical rather
      # than a line in a log.
      - alert: SignaraDnsProbeUnavailable
        expr: up{job="signara-dns-probe"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'The DNS probe is not reporting'
          description: 'Prometheus cannot scrape the DNS probe ({{ $labels.instance }}), so a hostname that stops resolving would go unnoticed until a user reported it.'
