# Alertmanager routing for Signara.
#
# The ${...} placeholders below are substituted from the environment at
# container start by ./entrypoint.sh. That step is not optional: Alertmanager
# has no env expansion of its own — there is no --config.expand-env in 0.27 or
# 0.28 — so an unrendered file passes '${SMTP_PASS}' through as the literal
# password. `amtool check-config` reports SUCCESS on such a file, which is how
# this silently shipped: a receiver that looks configured, validates, and
# delivers nowhere. Configure the relay in .env (SMTP_HOST/SMTP_PORT/SMTP_USER/
# SMTP_PASS, the same mail identity the app's notification workers use) and set
# ALERT_EMAIL_TO to a mailbox somebody actually reads.
#
# `hello` is not optional when the relay is a real MTA: Alertmanager says EHLO
# with the container's own hostname (Go's net/smtp defaults it to `localhost`),
# and a strict server — Stalwart, the estate's mail server, is one — answers
# `550 5.5.0 Invalid EHLO domain` because a single label is not a domain. Name
# the FQDN this host speaks as here; delivery then works and the failure is no
# longer a log line nobody reads.
global:
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${SMTP_FROM}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASS}'
  smtp_require_tls: true

route:
  receiver: email
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # Severity is carried in the subject line rather than split into separate
  # routes: the per-severity receivers this replaced pointed at
  # platform-critical@/platform@ mailboxes that do not exist, so critical alerts
  # were being addressed to nowhere. Add a route here when there are two real
  # destinations to send them to.

receivers:
  - name: email
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        hello: '${SMTP_HELLO}'
        # Alertmanager verifies the relay's certificate against the address it
        # dialled. An internal relay reached by IP with a self-signed
        # certificate (Stalwart here presents `rcgen self signed cert`, SAN
        # `localhost`) cannot satisfy that, so the opt-out is explicit rather
        # than a silent drop to plaintext: SMTP_TLS_INSECURE=true keeps
        # STARTTLS and skips verification. Leave it false for a relay with a
        # certificate that names the address.
        tls_config:
          insecure_skip_verify: ${SMTP_TLS_INSECURE}
        send_resolved: true
        headers:
          Subject: >-
            {{ if eq .Status "firing" }}[{{ .CommonLabels.severity | toUpper }}]{{ else }}[resolved]{{ end }}
            {{ .CommonLabels.alertname }}

inhibit_rules:
  - source_matchers: ['severity = critical']
    target_matchers: ['severity = warning']
    equal: ['alertname', 'service']
