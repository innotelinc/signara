# Alertmanager routing for Signara.
#
# The ${...} placeholders below are substituted from the environment at
# container start by ./entrypoint.sh. That step is not optional: Alertmanager
# has no env expansion of its own — there is no --config.expand-env in 0.27 or
# 0.28 — so an unrendered file passes '${SMTP_PASS}' through as the literal
# password. `amtool check-config` reports SUCCESS on such a file, which is how
# this silently shipped: a receiver that looks configured, validates, and
# delivers nowhere. Configure the relay in .env (SMTP_HOST/SMTP_PORT/SMTP_USER/
# SMTP_PASS) and set ALERT_EMAIL_TO to a mailbox somebody actually reads.
#
# The *transport* is shared with the app — one relay, one login — but the sender
# is not: SMTP_FROM below is the alerts identity, and the API sends product mail
# under its own address (SMTP_PRODUCT_FROM, see docs/Deployment.md §Monitoring
# and alerts). Alertmanager cannot use that address: the relay authorises one
# envelope per login, and this receiver's is the login itself.
#
# `hello` is not optional when the relay is a real MTA: Alertmanager says EHLO
# with the container's own hostname (Go's net/smtp defaults it to `localhost`),
# and a strict server — Stalwart, the estate's mail server, is one — answers
# `550 5.5.0 Invalid EHLO domain` because a single label is not a domain. Name
# the FQDN this host speaks as here; delivery then works and the failure is no
# longer a log line nobody reads.
global:
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${SMTP_FROM}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASS}'
  smtp_require_tls: true

# Notification body. Without this Alertmanager sends its default email — a bare
# `Labels` / `Annotations` dump and a `Source:` line — which is what the estate's
# delivery-probe mail looked like. The templates live beside this file and are
# mounted at /etc/alertmanager/email.tmpl (docker-compose.prod.yml).
templates:
  - '/etc/alertmanager/email.tmpl'

route:
  receiver: email
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # Warnings are evaluated and stay visible in the UI, but they are not mailed:
  # the estate's periodic probes all fire as `severity=warning`, and mailing every
  # one of them trained the reader to ignore the mailbox. Only `critical` still
  # pages — an alert that matches no sub-route keeps the top-level `email` receiver.
  #
  # The delivery probe is the one exception, and it is the reason the mailbox is
  # worth trusting: `ips/scripts/check-alert-delivery.py` injects it on a timer and
  # reads the mail server for the delivery, so a route that silences it leaves the
  # estate unable to tell a working receiver from a configured one — the state this
  # receiver sat in for its whole life before 2026-10-02, with `amtool check-config`
  # saying SUCCESS. It was silenced here from 2026-10-12 until 2026-10-15, and the
  # check kept "passing" in that window by matching a *different* mail that happened
  # to arrive inside its 90 s — a resolution of an unrelated alert. Matched before
  # the warning route, by the name only a probe carries, so the exception has one
  # owner rather than being a general carve-out for anything named like a test.
  routes:
    - matchers:
        - alertname =~ "EstateDeliveryProbe.*"
      receiver: email
    - matchers:
        - severity = warning
      receiver: silent

receivers:
  - name: email
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        hello: '${SMTP_HELLO}'
        # Alertmanager verifies the relay's certificate against the address it
        # dialled — so a relay reached by its LAN address whose certificate
        # names a host (`192.168.1.15` vs. `*.innotel.us`) fails verification,
        # with the certificate itself perfectly valid. `server_name` is the fix
        # that keeps verification ON: it is what the certificate is checked
        # against, and the SNI we offer. The API has the same switch for product
        # mail (SMTP_TLS_SERVERNAME), deliberately: neither service should be
        # able to force the other into the weaker setting.
        #
        # insecure_skip_verify drops the check altogether and is the fallback,
        # kept because a relay with a self-signed certificate cannot be named
        # into validity. Prefer server_name.
        tls_config:
          server_name: '${SMTP_TLS_SERVERNAME}'
          insecure_skip_verify: ${SMTP_TLS_INSECURE}
        send_resolved: true
        # The body and subject the reader actually gets: severity and alert name
        # in the subject, one block per alert, and a link back to the UI built
        # from --web.external-url.
        html: '{{ template "signara.email.html" . }}'
        text: '{{ template "signara.email.text" . }}'
        headers:
          Subject: '{{ template "signara.email.subject" . }}'

  # Routes to here notify nobody — the receiver carries no integration configs.
  # That is what keeps a warning in the UI without sending mail for it.
  - name: silent

inhibit_rules:
  - source_matchers: ['severity = critical']
    target_matchers: ['severity = warning']
    equal: ['alertname', 'service']
