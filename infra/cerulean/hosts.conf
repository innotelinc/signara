# Signara subdomain -> application port map for Cerulean.
#
# Format:
#   <subdomain>  <port>  [websockets]
#
# The upstream host is supplied by CERULEAN_LAN_IP and the DNS zone,
# certificate, and NGINX Proxy Manager are managed by Cerulean.
app    3000  yes
api    8000  yes
auth   9100  yes
admin  81    yes
