# Signara subdomain -> application port map for Cerulean.
#
# Format:
#   <subdomain>  <port>  [websockets]  [upstream-host]
#
# CERULEAN_LAN_IP is used for NGINX Proxy Manager upstreams unless an entry
# names its own `upstream-host` (the admin door below does — its backend binds
# loopback, which the LAN address cannot reach). DNS A records always use the
# validated public CERULEAN_WAN_IP. The DNS zone, certificate, and NGINX Proxy
# Manager are managed by Cerulean.
#
# Keep these ports equal to what docker-compose.prod.yml and this host actually
# bind. They were stale once (`api 8000`, `auth 9100`, `storage 9002`), which
# made a re-provision repoint the edge at the voice plane, a closed port, and
# the retired MinIO — a config typo that could take the edge down, not a doc
# error. `provision.py --dry-run` against the deployment prints "unchanged" for
# every line here when the two agree.
app       3000  yes
# :8000 is the voice plane (dograh-api) on this host; the API binds 8002.
api       8002  no
# Cerulean's Authentik, not this stack's profile-gated `authentik` service.
auth      9000  yes
# NPM's own admin UI behind Cerulean's SSO gate (oauth2-proxy on loopback).
admin     4180  yes  127.0.0.1
# onyx-objectstore, reached on the LAN address for browser presigned URLs.
storage   2090  no
# Served under this zone but owned by `ips` (its subscribe service), not
# Signara. Listed so provisioning keeps the door correct instead of surprising
# it; it belongs under its own label if the estate ever trims public names.
subscribe 3040  no
