# Signara subdomain -> application port map for Cerulean.
#
# Format:
#   <subdomain>  <port>  [websockets]
#
# CERULEAN_LAN_IP is used only for NGINX Proxy Manager upstreams.
# DNS A records always use the validated public CERULEAN_WAN_IP.
# The DNS zone, certificate, and NGINX Proxy Manager are managed by Cerulean.
app    3000  yes
api    8000  yes
auth   9100  yes
admin  81    yes
