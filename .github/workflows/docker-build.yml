name: Docker Build & Publish

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/signara

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            build_args: ''
          - service: web
            # The web bundle is *built*, not runtime-configured: NEXT_PUBLIC_*
            # is inlined into the client at build time. Building without these
            # silently bakes the Dockerfile's http://localhost defaults into
            # the published image, so the deployed login link and every API
            # call point at localhost and the signing room cannot open a
            # session. Keep the fallbacks in step with the production defaults
            # in docker-compose.prod.yml; set the API_URL/WEB_URL repository
            # variables to publish for a different deployment.
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.API_URL || 'https://api.signara.innotel.us' }}
              NEXT_PUBLIC_WEB_URL=${{ vars.WEB_URL || 'https://app.signara.innotel.us' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max

      - name: Generate SBOM (syft)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}.spdx.json

      - name: Attach SBOM to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: sbom-${{ matrix.service }}.spdx.json
