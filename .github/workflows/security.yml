name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  dependency-scan:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true # advisory triage; dependabot raises PRs

  container-scan:
    name: Container image scan (grype/trivy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            build_args: ''
          - image: web
            # The web Dockerfile requires its NEXT_PUBLIC_* URLs and refuses
            # loopback values (a localhost bundle is the v0.1.2 login defect),
            # so the scan build must name non-loopback placeholders. The URLs
            # do not affect what is scanned.
            build_args: >-
              --build-arg NEXT_PUBLIC_API_URL=https://api.signara.invalid
              --build-arg NEXT_PUBLIC_WEB_URL=https://app.signara.invalid
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f apps/${{ matrix.image }}/Dockerfile ${{ matrix.build_args }} -t signara-${{ matrix.image }}:scan .
      - name: Scan with Grype
        uses: anchore/scan-action@v7
        with:
          image: signara-${{ matrix.image }}:scan
          fail-build: false
          severity-cutoff: high

  secret-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}