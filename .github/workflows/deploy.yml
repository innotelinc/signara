name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]
  workflow_run:
    workflows: [Docker Build & Publish]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    if: github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Docker Compose (SSH)
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha || github.sha }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/signara
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_TAG,IMAGE_PREFIX
          script: |
            set -Eeuo pipefail
            cd /opt/signara
            git fetch origin main
            git reset --hard origin/main
            cp .env .env.bak || true
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            export SIGNARA_IMAGE_PREFIX="$IMAGE_PREFIX"
            ./setup.sh --production --use-images --image-tag="$IMAGE_TAG"
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
