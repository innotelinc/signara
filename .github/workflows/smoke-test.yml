name: Manual Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the deployed Signara API, including scheme
        required: true
        default: https://api.signara.innotel.us
        type: string
      web_url:
        description: Base URL of the deployed Signara web app, including scheme
        required: true
        default: https://app.signara.innotel.us
        type: string

jobs:
  smoke:
    name: Check deployed Signara instance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: API readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "${{ inputs.base_url }}/ready"; then break; fi
            sleep 5
          done
          curl -fsS "${{ inputs.base_url }}/ready" | grep -q '"status":"ok"' || exit 1

      - name: Swagger reachable
        run: curl -fsS -o /dev/null -w "%{http_code}\n" "${{ inputs.base_url }}/api/v1/docs"

      - name: Metrics exposed (authenticated scrape not required)
        run: curl -s "${{ inputs.base_url }}/metrics" | grep -q signara_http_requests_total || echo "metrics not exposed — verify Prometheus job"

      # The web bundle gets its API URL at *build* time, so an image built
      # without build args serves a login link and API calls pointing at
      # localhost. That looks like a working deploy and then fails in the
      # browser, so it is checked explicitly.
      - name: Deployed web app points at a real API, not localhost
        run: |
          html="$(curl -fsS "${{ inputs.web_url }}/")"
          if grep -q 'localhost' <<<"$html"; then
            echo "::error::${{ inputs.web_url }} serves a bundle built with localhost baked in"
            grep -oE 'https?://localhost:[0-9]+[^" ]*' <<<"$html" | sort -u | head
            exit 1
          fi
          grep -qE "href=\"${{ inputs.base_url }}/api/v1/auth/login" <<<"$html" \
            || echo "::warning::no login link to ${{ inputs.base_url }} found on the landing page"

      # Signara is OIDC-only and docs/Security.md says so: there is no password
      # endpoint and the web app ships no auth library. A password input on the
      # deployed login page would mean a second way in exists, so it is checked
      # on the running deployment rather than trusted to a code reading. No -L:
      # if the page ever redirects to the IdP, the body is empty and this passes
      # rather than reading Authentik's own form.
      - name: Login page offers no password door
        run: |
          body="$(curl -fsS "${{ inputs.web_url }}/login")"
          if grep -qiE 'type="password"|name="password"' <<<"$body"; then
            echo "::error::${{ inputs.web_url }}/login serves a password input — sign-in must be OIDC-only"
            exit 1
          fi

      - name: Report smoke-test status
        run: echo "Smoke tests passed for ${{ inputs.base_url }}"
